<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Gold Standard Lip-Sync Editor V2</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
:root{color-scheme:dark;--r:#ff2638;--r2:#ff6a76;--bg:#050507;--line:rgba(255,80,94,.25);--txt:#eee5e7;--mut:#9a8388}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}button,input,select{font:inherit}button{min-height:36px;border:1px solid var(--line);background:rgba(255,38,56,.05);color:#cdb9bd;padding:7px 10px}button:active,button.sel,.primary{border-color:rgba(255,80,94,.8);background:rgba(255,38,56,.15);color:#fff}button:disabled{opacity:.35}.app{height:100dvh;display:grid;grid-template-rows:40vh 60vh}.stage{position:relative;border-bottom:1px solid var(--line);min-height:0}#stage{width:100%;height:100%;display:block;touch-action:none}.headbar{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;pointer-events:none}.headbar h1{font-size:15px;margin:3px 0}.eyebrow,.status,.mini{font-size:9px;color:var(--mut);line-height:1.4}.hud{position:absolute;left:12px;bottom:10px;display:flex;gap:5px}.hud span{font-size:8px;padding:5px 7px;border:1px solid var(--line);background:rgba(5,5,7,.75)}.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px}.editor,.inspect{overflow:auto;min-height:0;padding:11px}.editor{border-right:1px solid var(--line)}.sentence{border:1px solid var(--line);padding:10px;font-size:12px;line-height:1.6;margin-bottom:9px}.sentence span{opacity:.45}.sentence span.active{opacity:1;color:#fff}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tapbox{border:1px solid rgba(255,80,94,.55);padding:8px;margin-bottom:9px;background:rgba(255,38,56,.06)}#tapWord{width:100%;min-height:52px;font-size:13px;font-weight:700}.tapStatus{text-align:center;margin:6px 0 0;color:#d4bec2;font-size:9px}.wave{height:86px;border:1px solid var(--line);position:relative;touch-action:none;background:#070609}.wave canvas{width:100%;height:100%}.playhead{position:absolute;top:0;bottom:0;width:1px;background:#fff;pointer-events:none}.scroll{overflow-x:auto;border:1px solid var(--line);border-top:0}.wordLane,.phones{position:relative;min-width:1100px}.wordLane{height:27px}.phones{height:70px;background:#070609;touch-action:none}.word{position:absolute;height:100%;padding:6px;font-size:8px;border-right:1px solid var(--line);overflow:hidden}.seg{position:absolute;height:100%;padding:8px 5px;border-right:1px solid rgba(255,255,255,.1);background:rgba(255,38,56,.05);overflow:hidden}.seg.sel{outline:1px solid var(--r);z-index:3}.seg.active{box-shadow:inset 0 -3px 0 var(--r)}.seg b{display:block;font-size:11px}.seg small{font-size:8px;color:var(--mut)}.handle{position:absolute;right:-5px;top:0;width:10px;height:100%;z-index:5;touch-action:none}.card{border:1px solid var(--line);padding:9px;margin-bottom:10px}.title{font-size:9px;letter-spacing:.1em;margin:3px 0 8px}.title span{color:var(--r)}.field{display:grid;gap:4px;margin:7px 0}.field label{font-size:8px;color:var(--mut)}.field input,.field select{width:100%;background:#08070a;color:white;border:1px solid var(--line);padding:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.speed{display:flex;gap:5px}.speed button{flex:1}.morph{display:grid;grid-template-columns:100px 1fr;gap:6px;align-items:center;font-size:8px;margin:5px 0;color:var(--mut)}.morph i{height:4px;background:#211217}.morph em{display:block;height:100%;width:0;background:var(--r2)}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0}.time{font-size:9px;color:var(--mut);margin-left:auto;align-self:center}@media(max-width:760px){.app{grid-template-rows:36vh 64vh}.workspace{display:block;overflow:auto}.editor,.inspect{overflow:visible;border:0}.inspect{border-top:1px solid var(--line)}.time{width:100%;margin-left:0}.sentence{font-size:11px}.tapbox{position:sticky;top:0;z-index:10;background:#09070a}.field input,.field select,button{min-height:44px}.handle{width:18px;right:-9px}}
</style>
</head>
<body><div class="app">
<section class="stage"><canvas id="stage"></canvas><div class="headbar"><div><div class="eyebrow">GOLD STANDARD / TAP-ALIGNED V2</div><h1>ICT FACEKIT × KNOWN SENTENCE</h1></div><div class="status" id="headStatus">LOADING HEAD</div></div><div class="hud"><span id="hudWord">—</span><span id="hudPhone">—</span><span id="hudVis">REST</span><span id="hudMs">0ms</span></div></section>
<section class="workspace"><main class="editor"><div class="sentence" id="sentence"></div><div class="toolbar"><button id="record" class="primary">RECORD SENTENCE</button><button id="play" disabled>PLAY</button><button id="back" disabled>−100ms</button><button id="forward" disabled>+100ms</button><label class="file"><button>LOAD AUDIO</button><input id="audioFile" type="file" accept="audio/*"></label><label class="file"><button>IMPORT PROJECT</button><input id="projectFile" type="file" accept="application/json,.json"></label><button id="export" disabled>EXPORT</button><span class="time" id="time">0.000 / 0.000s</span></div><div class="tapbox"><button id="tapAlign" disabled>TAP-ALIGN WORDS</button><button id="tapWord" class="primary" hidden>START</button><div class="tapStatus" id="tapStatus">Record or load the sentence, then tap-align its words.</div></div><div class="wave" id="waveWrap"><canvas id="wave"></canvas><div class="playhead" id="waveHead"></div></div><div class="scroll"><div class="wordLane" id="wordLane"></div><div class="phones" id="phones"></div></div><audio id="audio" preload="auto"></audio></main><aside class="inspect"><div class="title"><span>01</span> SELECTED PHONEME</div><div class="card"><div class="grid2"><div class="field"><label>Word</label><input id="selWord" disabled></div><div class="field"><label>Phone</label><input id="selPhone" disabled></div></div><div class="field"><label>Viseme</label><select id="viseme"></select></div><div class="field"><label>Strength <output id="strengthOut">1.00</output></label><input id="strength" type="range" min="0" max="1.5" step=".01" value="1"></div><div class="grid2"><div class="field"><label>Start ms</label><input id="startMs" type="number"></div><div class="field"><label>End ms</label><input id="endMs" type="number"></div></div></div><div class="title"><span>02</span> PLAYBACK</div><div class="card"><div class="field"><label>Coarticulation <output id="blendOut">55ms</output></label><input id="blend" type="range" min="0" max="180" step="5" value="55"></div><div class="speed"><button data-speed=".5">0.5×</button><button data-speed=".75">0.75×</button><button data-speed="1" class="sel">1×</button></div><p class="mini">Diphthongs now travel through their two mouth poses instead of freezing halfway.</p></div><div class="title"><span>03</span> FACEKIT OUTPUT</div><div class="card" id="morphs"></div></aside></section></div><script src="android-webm-duration-fix.js?v=1"></script><script type="module" src="editor.js?v=3"></script></body></html>
