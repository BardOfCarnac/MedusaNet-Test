name: Build calibration-enabled wLipSync

on:
  push:
    paths:
      - '.github/workflows/build-calibrated-wlipsync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test site
        uses: actions/checkout@v4

      - name: Check out wLipSync 1.3.1
        uses: actions/checkout@v4
        with:
          repository: mrxz/wLipSync
          ref: 177f3ac4095dbad81be0a800a8c6f975abe4ae04
          path: _wlipsync

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install WASM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binaryen

      - name: Patch wLipSync to expose live MFCC vectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('_wlipsync')

          main = root / 'src/main.c'
          s = main.read_text()
          needle = "float* get_volume_ptr() {\n  return &volume;\n}\n"
          replacement = needle + "\nfloat* get_mfcc_ptr() {\n  return mfccOut;\n}\n"
          if 'get_mfcc_ptr' not in s:
              if needle not in s:
                  raise SystemExit('Could not patch src/main.c')
              s = s.replace(needle, replacement)
              main.write_text(s)

          proc = root / 'www/audio-processor.js'
          s = proc.read_text()
          s = s.replace(
              "    volumeView = null;\n    mfccs = [];",
              "    volumeView = null;\n    mfccOutPtr = -1;\n    mfccOutView = null;\n    mfccs = [];"
          )
          s = s.replace(
              "            this.volumeView = new DataView(memory.buffer, this.volumePtr, 4);",
              "            this.volumeView = new DataView(memory.buffer, this.volumePtr, 4);\n            this.mfccOutPtr = exports.get_mfcc_ptr();\n            this.mfccOutView = new Float32Array(memory.buffer, this.mfccOutPtr, 12);"
          )
          s = s.replace(
              "            this.port.postMessage({ timestamp: currentTime, index, name: this.mfccs[index].name, volume });",
              "            this.port.postMessage({ timestamp: currentTime, index, name: this.mfccs[index].name, volume, mfcc: Array.from(this.mfccOutView) });"
          )
          proc.write_text(s)

          node = root / 'www/audio-node.ts'
          s = node.read_text()
          marker = "    public readonly weights: Record<string, number> = {};"
          if 'public readonly mfcc:' not in s:
              s = s.replace(marker, marker + "\n\n    /** Latest 12 MFCC coefficients from the analysis worklet. */\n    public readonly mfcc: number[] = new Array(12).fill(0);\n    /** AudioWorklet timestamp for the latest MFCC vector. */\n    public mfccTimestamp = -1;")
          onmsg = "    private onMessage(event: MessageEvent<WorkletMessage>) {\n        const deltaTime = event.data.timestamp - this.lastTimestamp;"
          repl = "    private onMessage(event: MessageEvent<WorkletMessage>) {\n        if(event.data.mfcc) {\n            for(let i = 0; i < Math.min(12, event.data.mfcc.length); i++) this.mfcc[i] = event.data.mfcc[i];\n            this.mfccTimestamp = event.data.timestamp;\n        }\n        const deltaTime = event.data.timestamp - this.lastTimestamp;"
          if onmsg not in s:
              raise SystemExit('Could not patch www/audio-node.ts')
          s = s.replace(onmsg, repl)
          node.write_text(s)

          types = root / 'www/types.ts'
          s = types.read_text()
          if 'mfcc?: number[];' not in s:
              s = s.replace("    volume: number;\n};", "    volume: number;\n    mfcc?: number[];\n};")
          types.write_text(s)
          PY

      - name: Build wLipSync single-file module
        working-directory: _wlipsync
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Copy browser module into Pages app
        run: |
          cp _wlipsync/dist/wlipsync-single.js voice-face-puppet-wlipsync/wlipsync-calibrated.js

      - name: Commit built module
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voice-face-puppet-wlipsync/wlipsync-calibrated.js
          if git diff --cached --quiet; then
            echo 'No build changes.'
          else
            git commit -m 'Build calibration-enabled wLipSync module'
            git push
          fi
